<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracking Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dashboard-container">
    <div class="profile-card">
      <div class="profile-header">
        <img src="./images/image-jeremy.png" alt="Jeremy Robson" class="profile-img">
        <div class="profile-info">
          <p>Report for</p>
          <h1>Jeremy Robson</h1>
        </div>
      </div>
      <div class="time-periods">
        <button class="period-btn active" data-period="daily">Daily</button>
        <button class="period-btn" data-period="weekly">Weekly</button>
        <button class="period-btn" data-period="monthly">Monthly</button>
      </div>
    </div>

    <div class="activity-card work">
      <div class="activity-bg"></div>
      <div class="activity-content">
        <div class="activity-header">
          <h2>Work</h2>
          <img src="./images/icon-ellipsis.svg" alt="More options">
        </div>
        <div class="activity-stats">
          <h3 class="current-hours">32hrs</h3>
          <p class="previous-hours">Last Week - 36hrs</p>
        </div>
      </div>
    </div>

    <div class="activity-card play">
      <div class="activity-bg"></div>
      <div class="activity-content">
        <div class="activity-header">
          <h2>Play</h2>
          <img src="./images/icon-ellipsis.svg" alt="More options">
        </div>
        <div class="activity-stats">
          <h3 class="current-hours">10hrs</h3>
          <p class="previous-hours">Last Week - 8hrs</p>
        </div>
      </div>
    </div>

    <div class="activity-card study">
      <div class="activity-bg"></div>
      <div class="activity-content">
        <div class="activity-header">
          <h2>Study</h2>
          <img src="./images/icon-ellipsis.svg" alt="More options">
        </div>
        <div class="activity-stats">
          <h3 class="current-hours">4hrs</h3>
          <p class="previous-hours">Last Week - 7hrs</p>
        </div>
      </div>
    </div>

    <div class="activity-card exercise">
      <div class="activity-bg"></div>
      <div class="activity-content">
        <div class="activity-header">
          <h2>Exercise</h2>
          <img src="./images/icon-ellipsis.svg" alt="More options">
        </div>
        <div class="activity-stats">
          <h3 class="current-hours">4hrs</h3>
          <p class="previous-hours">Last Week - 5hrs</p>
        </div>
      </div>
    </div>

    <div class="activity-card social">
      <div class="activity-bg"></div>
      <div class="activity-content">
        <div class="activity-header">
          <h2>Social</h2>
          <img src="./images/icon-ellipsis.svg" alt="More options">
        </div>
        <div class="activity-stats">
          <h3 class="current-hours">5hrs</h3>
          <p class="previous-hours">Last Week - 10hrs</p>
        </div>
      </div>
    </div>

    <div class="activity-card self-care">
      <div class="activity-bg"></div>
      <div class="activity-content">
        <div class="activity-header">
          <h2>Self Care</h2>
          <img src="./images/icon-ellipsis.svg" alt="More options">
        </div>
        <div class="activity-stats">
          <h3 class="current-hours">2hrs</h3>
          <p class="previous-hours">Last Week - 2hrs</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
